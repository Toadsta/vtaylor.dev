<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@font-face {
    font-family: "Fira Mono";
    src: url("./fira-mono-700.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
}
* { margin: 0; padding: 0; }
html, body { width: 512px; height: 512px; overflow: hidden; box-sizing: border-box; border: 8px solid #ff0000; }
.squircle {
    position: relative;
    width: 100%;
    height: 100%;
    background: #33312b;
    border-radius: 152px;
    corner-shape: squircle;
}
svg { display: block; position: absolute; top: 0; left: 0; }
text {
    font-family: "Fira Mono", monospace;
    font-weight: 700;
    font-size: 290px;
    fill: #f0eee4;
    dominant-baseline: central;
}
</style>
</head>
<body>
<div class="squircle">
    <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <text x="270" y="259" text-anchor="end">V</text>
        <text x="250" y="259" text-anchor="start">T</text>
    </svg>
</div>
</body>
</html>
